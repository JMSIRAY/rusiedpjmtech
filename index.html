<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Item Tracker</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --primary-color: #ffcc00; /* Yellow */
      --text-color: #ffffff;
      --text-muted: #aaaaaa;
      --input-bg: #262626;
      --success-color: #00ff66;
      --error-color: #ff3333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 204, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    /* Glow effect on top */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--primary-color);
      box-shadow: 0 2px 20px var(--primary-color);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header i {
      font-size: 3rem;
      color: var(--primary-color);
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 22px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--primary-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
      transition: color 0.3s;
    }

    .form-group input {
      width: 100%;
      padding: 14px 15px 14px 45px;
      background-color: var(--input-bg);
      border: 2px solid transparent;
      border-radius: 8px;
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
    }

    .form-group input:focus + i {
      color: var(--primary-color);
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background-color: var(--primary-color);
      color: #000000;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.3s, box-shadow 0.3s;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-submit:hover {
      background-color: #e6b800;
      box-shadow: 0 5px 20px rgba(255, 204, 0, 0.4);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Loading and Overlay Message States */
    .overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 13, 13, 0.95);
      z-index: 10;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      border-radius: 16px;
    }

    .overlay i.status-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .overlay.loading i {
      color: var(--primary-color);
      animation: spin 1s linear infinite;
    }

    .overlay.success i { color: var(--success-color); }
    .overlay.error i { color: var(--error-color); }
    
    .overlay h2 {
      font-weight: 600;
      margin-bottom: 10px;
    }

    .btn-reset {
      margin-top: 20px;
      padding: 10px 20px;
      background: transparent;
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-reset:hover {
      background: var(--primary-color);
      color: #000;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Status Overlay (Loading/Success/Error) -->
    <div id="overlay" class="overlay">
      <i id="overlayIcon" class="fa-solid status-icon"></i>
      <h2 id="overlayTitle">Processing...</h2>
      <p id="overlayMessage">Please wait while we log your data.</p>
      <button id="btnReset" class="btn-reset" onclick="resetForm()" style="display:none;">Log Another Item</button>
    </div>

    <!-- Main Form -->
    <div class="header">
      <i class="fa-solid fa-boxes-stacked"></i>
      <h1>RUSI EDP ITEM TRACKER</h1>
      <p>Scan & Submit Asset Log Details</p>
    </div>

    <form id="trackerForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="location">Location</label>
        <div class="input-wrapper">
          <input type="text" id="location" placeholder="e.g., San Manuel Bodega" required>
          <i class="fa-solid fa-location-dot"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="item">Item Description</label>
        <div class="input-wrapper">
          <input type="text" id="item" placeholder="e.g., COMPUTER SET, SERVER SET" required>
          <i class="fa-solid fa-box"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="receivedBy">Received By (Name)</label>
        <div class="input-wrapper">
          <input type="text" id="receivedBy" placeholder="e.g., Juan Dela Cruz" required>
          <i class="fa-solid fa-user"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="contactNumber">Contact Number</label>
        <div class="input-wrapper">
          <input type="tel" id="contactNumber" placeholder="e.g., 09123456789" pattern="[0-9]{11}" title="Please enter an 11-digit mobile number" required>
          <i class="fa-solid fa-phone"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>Submit Log</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>
  </div>

  <script>
    // IPASTE DITO ANG IYONG BAGONG WEB APP URL MULA SA GOOGLE SHEETS
    const googleSheetUrl = "https://script.google.com/macros/s/AKfycbz_UAaYWJmjIlhAB90M_BQ2r76vyuhk5UNaVXiw7SS_2VKRjZI9YioZIck_K6s9ihY/exec"; 

    function handleFormSubmit(event) {
      event.preventDefault();
      
      const overlay = document.getElementById('overlay');
      const icon = document.getElementById('overlayIcon');
      const title = document.getElementById('overlayTitle');
      const msg = document.getElementById('overlayMessage');
      const resetBtn = document.getElementById('btnReset');

      // Pakita ang Loading State
      overlay.style.display = 'flex';
      overlay.className = 'overlay loading';
      icon.className = 'fa-solid fa-circle-notch status-icon';
      title.innerText = 'Submitting Data...';
      msg.innerText = 'Connecting to Google Sheets database.';
      resetBtn.style.display = 'none';

      // Pagkuha ng mga isinulat sa Form
      const formData = {
        location: document.getElementById('location').value,
        item: document.getElementById('item').value,
        receivedBy: document.getElementById('receivedBy').value,
        contactNumber: document.getElementById('contactNumber').value
      };

      // Paggamit ng Fetch API para ipadala ang data sa Google Sheet Web App
      fetch(googleSheetUrl, {
        method: "POST",
        mode: "no-cors", // Iniiwasan nito ang pag-block ng browser
        cache: "no-cache",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(formData)
      })
      .then(() => {
        // Dahil naka 'no-cors' mode tayo, awtomatiko itong magiging matagumpay basta tama ang URL
        overlay.className = 'overlay success';
        icon.className = 'fa-solid fa-circle-check status-icon';
        title.innerText = 'Success!';
        msg.innerText = 'Asset log details have been saved successfully.';
        resetBtn.style.display = 'block';
        document.getElementById('trackerForm').reset();
      })
      .catch(error => {
        overlay.className = 'overlay error';
        icon.className = 'fa-solid fa-circle-xmark status-icon';
        title.innerText = 'Submission Failed';
        msg.innerText = 'Error connecting to database: ' + error;
        resetBtn.style.display = 'block';
      });
    }

    function resetForm() {
      const overlay = document.getElementById('overlay');
      overlay.style.display = 'none';
    }
  </script>
</body>
</html>
